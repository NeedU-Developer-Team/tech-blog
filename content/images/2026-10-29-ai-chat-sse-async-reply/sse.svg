<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="SSE: 브라우저가 스트림 연결을 한 번 열어 두면, 메시지는 POST로 보내고 답변 조각은 열린 응답으로 계속 내려오는 흐름"><title>SSE: 브라우저가 스트림 연결을 한 번 열어 두면, 메시지는 POST로 보내고 답변 조각은 열린 응답으로 계속 내려오는 흐름</title><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c4cbd3"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3182f6"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c5cff"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b95a1"/></marker></defs><rect x="0.5" y="0.5" width="759" height="349" rx="16" fill="#ffffff" stroke="#e5e8eb"/><text x="24" y="34" font-size="15" fill="#191f28" text-anchor="start" font-weight="700">SSE · 열어 둔 HTTP 응답 하나에 서버가 이벤트를 이어서 씁니다</text><text x="24" y="56" font-size="12" fill="#4e5968" text-anchor="start" font-weight="500">보내기는 기존 POST 그대로 두고, 서버에서 내려가는 방향만 SSE로 떼어 냈습니다</text><rect x="24" y="74" width="232" height="196" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"/><text x="140" y="100" font-size="14" fill="#191f28" text-anchor="middle" font-weight="700">브라우저</text><rect x="96" y="112" width="148" height="26" rx="13" fill="#3182f6" stroke="#3182f6" stroke-width="1"/><text x="170" y="129.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="500">요즘 러닝 시작했어요</text><g opacity="0"><rect x="36" y="152" width="208" height="74" rx="13" fill="#ffffff" stroke="#d9dde2" stroke-width="1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.35;0.362;1"/></g><g opacity="0"><text x="48" y="176" font-size="12" fill="#191f28" text-anchor="start" font-weight="500">러닝 좋네요!</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.35;0.362;1"/></g><g opacity="0"><text x="48" y="196" font-size="12" fill="#191f28" text-anchor="start" font-weight="500">저도 응원할게요.</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.45;0.462;1"/></g><g opacity="0"><text x="48" y="216" font-size="12" fill="#191f28" text-anchor="start" font-weight="500">보통 언제 달리는 편이에요?</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.73;0.742;1"/></g><rect x="504" y="74" width="232" height="196" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"/><text x="620" y="100" font-size="14" fill="#191f28" text-anchor="middle" font-weight="700">BE 서버</text><text x="620" y="119" font-size="11.5" fill="#8b95a1" text-anchor="middle" font-weight="500">SseEmitter로 이벤트 전송</text><g opacity="0"><rect x="522" y="144" width="60" height="26" rx="13" fill="#e3f7ec" stroke="#00a661" stroke-width="1"/><text x="552" y="161.5" font-size="12" fill="#00a661" text-anchor="middle" font-weight="600">조각 1</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.28;0.292;0.3;0.312;1"/></g><g opacity="0"><rect x="590" y="144" width="60" height="26" rx="13" fill="#e3f7ec" stroke="#00a661" stroke-width="1"/><text x="620" y="161.5" font-size="12" fill="#00a661" text-anchor="middle" font-weight="600">조각 2</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.38;0.392;0.4;0.412;1"/></g><g opacity="0"><rect x="658" y="144" width="60" height="26" rx="13" fill="#e3f7ec" stroke="#00a661" stroke-width="1"/><text x="688" y="161.5"