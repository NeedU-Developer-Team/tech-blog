4" rx="12" fill="#7c5cff"/><text x="0" y="4.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">메시지</text><animateMotion dur="9s" repeatCount="indefinite" path="M300 165 H460" keyPoints="0;0;1;1" keyTimes="0;0.17;0.24;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.17;0.182;0.24;0.252;1"/></g><g opacity="0"><rect x="-31" y="-12" width="62" height="24" rx="12" fill="#00a661"/><text x="0" y="4.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">조각 1</text><animateMotion dur="9s" repeatCount="indefinite" path="M460 165 H300" keyPoints="0;0;1;1" keyTimes="0;0.29;0.35;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.29;0.302;0.35;0.362;1"/></g><g opacity="0"><rect x="-31" y="-12" width="62" height="24" rx="12" fill="#00a661"/><text x="0" y="4.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">조각 2</text><animateMotion dur="9s" repeatCount="indefinite" path="M460 165 H300" keyPoints="0;0;1;1" keyTimes="0;0.39;0.45;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.39;0.402;0.45;0.462;1"/></g><g opacity="0"><rect x="-31" y="-12" width="62" height="24" rx="12" fill="#00a661"/><text x="0" y="4.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">조각 3</text><animateMotion dur="9s" repeatCount="indefinite" path="M460 165 H300" keyPoints="0;0;1;1" keyTimes="0;0.67;0.73;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.67;0.682;0.73;0.742;1"/></g><text x="380" y="250" font-size="11.5" fill="#f08c00" text-anchor="middle" font-weight="600">인증·오류 응답·재연결을 직접 챙겨야 함</text><text x="24" y="304" font-size="12" fill="#4e5968" text-anchor="start" font-weight="600">문장이 준비됨</text><rect x="150" y="299" width="586" height="2" rx="1" fill="#eceef1" stroke="#eceef1" stroke-width="0"/><g opacity="0"><circle cx="314.08" cy="300" r="6" fill="#00a661"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.28;0.292;1"/></g><g opacity="0"><circle cx="372.68" cy="300" r="6" fill="#00a661"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.38;0.392;1"/></g><g opacity="0"><circle cx="536.76" cy="300" r="6" fill="#00a661"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.66;0.672;1"/></g><text x="24" y="330" font-size="12" fill="#4e5968" text-anchor="start" font-weight="600">화면에 보임</text><rect x="150" y="325" width="586" height="2" rx="1" fill="#eceef1" stroke="#eceef1" stroke-width="0"/><g opacity="0"><circle cx="355.1" cy="326" r="6" fill="#3182f6"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.35;0.362;1"/></g><g opacity="0"><circle cx="413.7" cy="326" r="6" fill="#3182f6"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.45;0.462;1"/></g><g opacity="0"><circle cx="577.78" cy="326" r="6" fill="#3182f6"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.73;0.742;1"/></g></svg>