<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="답변 저장, 생성 중 표시 삭제, 락 해제, completed 발행, done 발행 순서와 그때 재연결한 화면이 보는 것"><title>답변 저장, 생성 중 표시 삭제, 락 해제, completed 발행, done 발행 순서와 그때 재연결한 화면이 보는 것</title><defs><marker id="ah-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#191f28"/></marker><marker id="ah-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4e5968"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b95a1"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c4cbd3"/></marker><marker id="ah-box" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4f5f7"/></marker><marker id="ah-boxs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9dde2"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3182f6"/></marker><marker id="ah-bluebg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8f3ff"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00a661"/></marker><marker id="ah-greenbg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3f7ec"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f04452"/></marker><marker id="ah-redbg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffeced"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f08c00"/></marker><marker id="ah-orangebg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff3df"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c5cff"/></marker><marker id="ah-purplebg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f1edff"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect x="0.5" y="0.5" width="759" height="299" rx="16" fill="#ffffff" stroke="#e5e8eb"/><text x="24" y="34" font-size="15" fill="#191f28" text-anchor="start" font-weight="700">턴을 끝내는 순서 · 언제 다시 들어와도 답변을 놓치지 않게</text><rect x="24" y="76" width="132" height="56" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#f4f5f7;#e8f3ff" keyTimes="0;0.06"/><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#d9dde2;#3182f6" keyTimes="0;0.06"/></rect><text x="90" y="109" font-size="12.5" fill="#191f28" text-anchor="middle" font-weight="700">① 답변 DB 저장</text><path d="M158 104 H168" fill="none" stroke="#c4cbd3" stroke-width="1.5" marker-end="url(#ah-line)" stroke-linecap="round"></path><rect x="170" y="76" width="132" height="56" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#f4f5f7;#e8f3ff" keyTimes="0;0.22"/><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#d9dde2;#3182f6" keyTimes="0;0.22"/></rect><text x="236" y="109" font-size="12.5" fill="#191f28" text-anchor="middle" font-weight="700">② 생성 중 표시 삭제</text><path d="M304 104 H314" fill="none" stroke="#c4cbd3" stroke-width="1.5" marker-end="url(#ah-line)" stroke-linecap="round"></path><rect x="316" y="76" width="132" height="56" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#f4f5f7;#e8f3ff" keyTimes="0;0.38"/><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#d9dde2;#3182f6" keyTimes="0;0.38"/></rect><text x="382" y="109" font-size="12.5" fill="#191f28" text-anchor="middle" font-weight="700">③ 대화방 락 해제</text><path d="M450 104 H460" fill="none" stroke="#c4cbd3" stroke-width="1.5" marker-end="url(#ah-line)" stroke-linecap="round"></path><rect x="462" y="76" width="132" height="56" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#f4f5f7;#e8f3ff" keyTimes="0;0.54"/><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#d9dde2;#3182f6" keyTimes="0;0.54"/></rect><text x="528" y="109" font-size="12.5" fill="#191f28" text-anchor="middle" font-weight="700">④ completed 발행</text><path d="M596 104 H606" fill="none" stroke="#c4cbd3" stroke-width="1.5" marker-end="url(#ah-line)" stroke-linecap="round"></path><rect x="608" y="76" width="132" height="56" rx="12" fill="#f4f5f7" stroke="#d9dde2" stroke-width="1.5"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#f4f5f7;#e8f3ff" keyTimes="0;0.7"/><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" values="#d9dde2;#3182f6" keyTimes="0;0.7"/></rect><text x="674" y="109" font-size="12.5" fill="#191f28" text-anchor="middle" font-weight="700">⑤ done 발행</text><g opacity="0"><circle r="6" fill="#3182f6"/><animateMotion dur="9s" repeatCount="indefinite" path="M90 146 H674" keyPoints="0;0;1;1" keyTimes="0;0.06;0.7;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.06;0.072;0.95;0.962;1"/></g><text x="24" y="186" font-size="12.5" fill="#4e5968" text-anchor="start" font-weight="600">이 순간 대화방에 다시 들어온 화면은</text><g opacity="0"><rect x="24" y="200" width="712" height="70" rx="12" fill="#fff3df" stroke="#f08c00" stroke-width="1.5"></rect><text x="380" y="230" font-size="13" fill="#f08c00" text-anchor="middle" font-weight="700">connected: generating = true</text><text x="380" y="254" font-size="12" fill="#4e5968" text-anchor="middle" font-weight="500">“아직 만드는 중” → 곧 도착할 completed를 기다립니다</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.22;0.232;1"/></g><g opacity="0"><rect x="24" y="200" width="712" height="70" rx="12" fill="#e3f7ec" stroke="#00a661" stroke-width="1.5"></rect><text x="380" y="230" font-size="13" fill="#00a661" text-anchor="middle" font-weight="700">connected: generating = false</text><text x="380" y="254" font-size="12" fill="#4e5968" text-anchor="middle" font-weight="500">“이미 끝남” → 메시지 목록을 조회하면 ①에서 저장한 답변이 있습니다</text><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.22;0.232;0.97;0.982;1"/></g></svg>