<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 520" role="img" aria-labelledby="title desc">
  <title id="title">답변이 오지 않는 AI 챗봇 화면</title>
  <desc id="desc">사용자가 메시지를 보낸 뒤 니쥬의 말풍선에 점 세 개만 계속 깜빡이고 답변은 나타나지 않는 애니메이션</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #202020; }
    .dot { animation: blink 1.2s ease-in-out infinite; }
    .dot2 { animation-delay: .2s; }
    .dot3 { animation-delay: .4s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: .6; }
    }
  </style>

  <rect width="858" height="520" fill="#f7f7f7"/>

  <rect x="450" y="50" width="380" height="84" rx="26" fill="#fee500"/>
  <text x="485" y="102" font-size="28" font-weight="600">요즘 러닝 시작했어요.</text>

  <g>
    <image x="28" y="214" width="96" height="96" href="data:image/jpeg;base64,"/>
    <rect x="147" y="180" width="230" height="140" rx="26" fill="#fff"/>
    <text x="180" y="227" font-size="24" font-weight="700">니쥬</text>
    <circle class="dot" cx="196" cy="276" r="10" fill="#8b95a1"/>
    <circle class="dot dot2" cx="232" cy="276" r="10" fill="#8b95a1"/>
    <circle class="dot dot3" cx="268" cy="276" r="10" fill="#8b95a1"/>
  </g>

  <rect x="28" y="410" width="802" height="84" rx="22" fill="#fff" stroke="#d8d8d8" stroke-width="2"/>
  <rect x="60" y="431" width="3" height="42" rx="1.5" fill="#202020"/>
  <text x="74" y="466" font-size="29" fill="#969696">메시지 입력</text>
  <circle cx="782" cy="452" r="32" fill="#dedede"/>
  <path d="M782 466v-28m0 0-11 11m11-11 11 11" fill="none" stroke="#8b8b8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
