<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="줄 높이 통일. 상품명이 한 줄인 카드와 두 줄인 카드가 섞이면 줄마다 높이가 달라진다. 상품명 영역을 항상 두 줄 높이로 확보하면 모든 줄의 높이가 같아진다."><title>줄 높이 통일. 상품명이 한 줄인 카드와 두 줄인 카드가 섞이면 줄마다 높이가 달라진다. 상품명 영역을 항상 두 줄 높이로 확보하면 모든 줄의 높이가 같아진다.</title>
