<text x="200" y="286" font-size="12.5" fill="#191f28" font-weight="700" text-anchor="middle">DOM 노드 2,274개</text>
<text x="200" y="306" font-size="11.5" fill="#8b95a1" text-anchor="middle">메모리 22.1MB · 돌아오는 시간 263ms</text>
<rect x="500" y="58" width="120" height="196" rx="6" fill="#ffeced" stroke="#ffc9cd"/>
<text x="560" y="96" font-size="11.5" fill="#d22030" text-anchor="middle">지나간 카드</text>
<text x="560" y="114" font-size="11.5" fill="#d22030" text-anchor="middle">수천 장이</text>
<text x="560" y="132" font-size="11.5" fill="#d22030" text-anchor="middle">그대로 남아 있음</text>
<rect x="492" y="172" width="136" height="64" rx="10" fill="#e8f3ff" stroke="#3182f6" stroke-width="2"/>
