<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="카드가 쌓이는 구조. 무한 스크롤로 20개씩 불러온 카드가 지워지지 않고 계속 쌓여, 200장일 때보다 5,000장일 때 화면에 남아 있는 카드와 DOM 노드가 훨씬 많다. 실제로 화면에 보이는 카드는 한 화면 분량뿐이다."><title>카드가 쌓이는 구조. 무한 스크롤로 20개씩 불러온 카드가 지워지지 않고 계속 쌓여, 200장일 때보다 5,000장일 때 화면에 남아 있는 카드와 DOM 노드가 훨씬 많다. 실제로 화면에 보이는 카드는 한 화면 분량뿐이다.</title>
