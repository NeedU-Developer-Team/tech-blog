<text x="560" y="40" font-size="14" fill="#191f28" font-weight="700" text-anchor="middle">5,000장까지 불러왔을 때</text>
<line x1="380" y1="24" x2="380" y2="356" stroke="#f2f4f6" stroke-width="1.5"/>
<rect x="140" y="58" width="120" height="110" rx="6" fill="#ffeced" stroke="#ffc9cd"/>
