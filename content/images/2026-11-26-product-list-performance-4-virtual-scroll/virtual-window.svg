<text x="560" y="213" font-size="12" fill="#1b64da" font-weight="700" text-anchor="middle">보이는 화면</text>
<g fill="#ffe1b8"><rect x="508" y="242" width="104" height="14" rx="4"/><rect x="508" y="258" width="104" height="14" rx="4"/></g>
<text x="560" y="294" font-size="11.5" fill="#8b95a1" text-anchor="middle">빈 공간</text>
<text x="650" y="157" font-size="11" fill="#c66b00">위 여유 줄</text>
<text x="650" y="261" font-size="11" fill="#c66b00">아래 여유 줄</text>
