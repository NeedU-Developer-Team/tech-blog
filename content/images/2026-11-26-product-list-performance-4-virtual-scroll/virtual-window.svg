<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="가상 스크롤 개념. 목록 전체 높이는 5,000장 기준으로 유지하지만, 실제로 그리는 것은 지금 보이는 화면과 위아래 몇 줄뿐이다. 나머지는 빈 공간으로 높이만 차지하고, 스크롤하면 그리는 줄이 바뀐다."><title>가상 스크롤 개념. 목록 전체 높이는 5,000장 기준으로 유지하지만, 실제로 그리는 것은 지금 보이는 화면과 위아래 몇 줄뿐이다. 나머지는 빈 공간으로 높이만 차지하고, 스크롤하면 그리는 줄이 바뀐다.</title>
<rect x="0.5" y="0.5" width="759" height="399" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
