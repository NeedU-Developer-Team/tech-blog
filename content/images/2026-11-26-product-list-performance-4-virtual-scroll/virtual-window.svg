<text x="560" y="114" font-size="11" fill="#8b95a1" text-anchor="middle">높이만 차지</text>
<g fill="#ffe1b8"><rect x="508" y="144" width="104" height="14" rx="4"/><rect x="508" y="160" width="104" height="14" rx="4"/></g>
