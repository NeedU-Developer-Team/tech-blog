<text x="200" y="344" font-size="12" fill="#c66b00" font-weight="700" text-anchor="middle">모든 줄을 그려 둠</text>
<rect x="500" y="58" width="120" height="260" rx="6" fill="#ffffff" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5 4"/>
