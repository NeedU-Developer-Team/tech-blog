<rect x="636" y="168" width="5" height="40" rx="2.5" fill="#3182f6"/>
<text x="560" y="344" font-size="12" fill="#1b64da" font-weight="700" text-anchor="middle">근처 줄만 그리고, 전체 높이는 유지</text>
<text x="380" y="372" font-size="11.5" fill="#8b95a1" text-anchor="middle">스크롤바 길이는 같아서 사용자는 차이를 느끼지 못하고, 스크롤하면 그리는 줄만 바뀜</text>
</svg>
