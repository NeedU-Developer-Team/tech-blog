<rect x="140" y="242" width="120" height="16" rx="4"/><rect x="140" y="262" width="120" height="16" rx="4"/><rect x="140" y="282" width="120" height="16" rx="4"/><rect x="140" y="302" width="120" height="16" rx="4"/>
