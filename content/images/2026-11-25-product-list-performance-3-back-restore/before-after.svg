<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="세 구조 비교. 개선 전에는 목록 컴포넌트와 함께 필터와 위치가 사라져 맨 위에서 시작한다. 스크롤할 때마다 위치만 적으면 떠나는 순간의 0이 덮어써져 여전히 맨 위에서 시작한다. 지금 구조는 방문 기록 이름표로 구분해 그리기 전에 복원하고, 5분 동안 목록을 붙잡아 떠날 때와 같은 위치로 돌아온다."><title>세 구조 비교. 개선 전에는 목록 컴포넌트와 함께 필터와 위치가 사라져 맨 위에서 시작한다. 스크롤할 때마다 위치만 적으면 떠나는 순간의 0이 덮어써져 여전히 맨 위에서 시작한다. 지금 구조는 방문 기록 이름표로 구분해 그리기 전에 복원하고, 5분 동안 목록을 붙잡아 떠날 때와 같은 위치로 돌아온다.</title>
