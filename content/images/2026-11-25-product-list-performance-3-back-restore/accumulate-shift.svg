<text x="530" y="277" font-size="12.5" fill="#4e5968" text-anchor="middle">상품 C · 70점</text>
<path d="M136 176 H150 M310 176 H450 M610 176 H720" fill="none" stroke="#f04452" stroke-width="1.5" stroke-dasharray="6 5"/>
