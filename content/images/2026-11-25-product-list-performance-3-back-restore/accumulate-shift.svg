<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="새 상품이 끼어들 때의 스크롤 위치. 분석 확정 전에는 저장한 위치에 상품 C가 있다. 확정 후 점수 순서에 따라 위쪽에 새 상품이 끼어들면, 같은 위치에 상품 C가 아닌 다른 상품이 보인다."><title>새 상품이 끼어들 때의 스크롤 위치. 분석 확정 전에는 저장한 위치에 상품 C가 있다. 확정 후 점수 순서에 따라 위쪽에 새 상품이 끼어들면, 같은 위치에 상품 C가 아닌 다른 상품이 보인다.</title>
<rect x="0.5" y="0.5" width="759" height="379" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
