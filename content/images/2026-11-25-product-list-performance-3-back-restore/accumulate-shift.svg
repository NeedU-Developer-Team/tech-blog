<text x="380" y="326" font-size="13" fill="#191f28" font-weight="700" text-anchor="middle">위치 숫자는 같아도, 위쪽에 새 상품이 끼어들면 보던 상품 C가 아니라 B가 보임</text>
<text x="380" y="350" font-size="11.5" fill="#8b95a1" text-anchor="middle">목록은 추천 점수 순서라, 새 상품이 맨 뒤가 아닌 기존 상품 사이에 들어감</text>
