<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="목록 컴포넌트와 상태의 관계. 목록 화면에 있을 때는 목록 컴포넌트가 카테고리 리빙과 예산 13만 원을 기억한다. 상세로 이동하면 목록 컴포넌트가 사라지면서 기억도 함께 사라진다. 돌아오면 새 목록 컴포넌트가 카테고리 전체, 예산 20만 원의 처음 값으로 시작한다."><title>목록 컴포넌트와 상태의 관계. 목록 화면에 있을 때는 목록 컴포넌트가 카테고리 리빙과 예산 13만 원을 기억한다. 상세로 이동하면 목록 컴포넌트가 사라지면서 기억도 함께 사라진다. 돌아오면 새 목록 컴포넌트가 카테고리 전체, 예산 20만 원의 처음 값으로 시작한다.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b95a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
