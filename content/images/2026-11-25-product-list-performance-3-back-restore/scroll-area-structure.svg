<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="일반 페이지와 NeedU 화면 구조 비교. 일반 페이지는 페이지 전체가 스크롤되어 브라우저가 뒤로가기 때 위치를 기억한다. NeedU는 헤더와 하단 메뉴가 고정되고 가운데 영역만 스크롤되어, 브라우저가 위치를 기억하지 않는다."><title>일반 페이지와 NeedU 화면 구조 비교. 일반 페이지는 페이지 전체가 스크롤되어 브라우저가 뒤로가기 때 위치를 기억한다. NeedU는 헤더와 하단 메뉴가 고정되고 가운데 영역만 스크롤되어, 브라우저가 위치를 기억하지 않는다.</title>
