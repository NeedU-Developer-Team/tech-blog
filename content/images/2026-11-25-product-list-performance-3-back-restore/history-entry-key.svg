<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="방문 기록 이름표로 뒤로가기와 새 진입을 구분하는 흐름. 목록에 들어오면 방문 기록 칸의 메모지(history.state)에 이름표 A를 붙이고, Zustand에 이름표 A의 필터와 위치를 저장한다. 뒤로가기로 돌아오면 이름표 A를 찾아 복원하고, 메뉴로 새로 들어오면 이름표가 없는 새 칸이라 처음 상태로 시작한다."><title>방문 기록 이름표로 뒤로가기와 새 진입을 구분하는 흐름. 목록에 들어오면 방문 기록 칸의 메모지(history.state)에 이름표 A를 붙이고, Zustand에 이름표 A의 필터와 위치를 저장한다. 뒤로가기로 돌아오면 이름표 A를 찾아 복원하고, 메뉴로 새로 들어오면 이름표가 없는 새 칸이라 처음 상태로 시작한다.</title>
